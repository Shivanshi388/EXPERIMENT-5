<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather App</title>
<style>
* { box-sizing: border-box; }
body {
margin: 0; min-height: 100vh; padding: 32px 16px;
font-family: "Segoe UI", Tahoma, Arial, sans-serif;
font-size: 16px; line-height: 1.5;
color: #1c2b39; background: #dfeaf5;
}
.weather-app {
max-width: 460px; margin: 0 auto;
background: #fff; border-radius: 14px; padding: 24px;
box-shadow: 0 4px 16px rgba(28, 43, 57, 0.12);
}
/* Search */
form { display: flex; gap: 8px; }
input[type="text"] {
flex: 1; min-width: 0; padding: 11px 14px;
font: inherit; border: 1px solid #b8c9db; border-radius: 8px;
}
input[type="text"]:focus { outline: 2px solid #2a6fb0; border-color: #2a6fb0; }
button {
padding: 11px 20px; font: inherit; font-weight: 600;
color: #fff; background: #2a6fb0; border: none; border-radius: 8px; cursor: pointer;
}
button:hover { background: #1f5a92; }
button:disabled { opacity: 0.6; cursor: wait; }
.message { min-height: 26px; margin: 12px 2px 0; color: #4a5b6b; }
.message.error { color: #c0392b; font-weight: 600; }

/* Current weather */
.today { display: none; margin-top: 18px; text-align: center; }
.today.show { display: block; }
.city { margin: 0; font-size: 1.6rem; }
.updated { margin: 2px 0 0; font-size: 0.85rem; color: #5d6e7e; }
.big-temp { font-size: 5rem; font-weight: 300; line-height: 1.1; margin: 10px 0 0; }
.big-icon { font-size: 3rem; }
.summary { font-size: 1.15rem; color: #4a5b6b; }
.stats { display: flex; margin-top: 18px; border-top: 1px solid #dde6ee; border-bottom: 1px solid #dde6ee; }
.stats div { flex: 1; padding: 12px 4px; font-size: 0.85rem; color: #5d6e7e; }
.stats strong { display: block; font-size: 1.2rem; color: #1c2b39; font-weight: 600; }

/* Forecast */
.forecast { display: none; margin-top: 22px; }
.forecast.show { display: block; }
h2 { margin: 0 0 6px; font-size: 1.15rem; }
.day-row {
display: grid; grid-template-columns: 5rem 2rem 1fr 3rem 3rem;
align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid #dde6ee;
}
.day-row .low { color: #5d6e7e; text-align: right; }
.day-row .high { font-weight: 600; text-align: right; }
</style>
</head>
<body>

<main class="weather-app">
<form id="search-form">
<input type="text" id="city-input" placeholder="Enter a city name"
aria-label="City name" autocomplete="off">
<button type="submit" id="search-btn">Search</button>
</form>
<p class="message" id="message" role="status">Type a city name to see its weather.</p>

<section class="today" id="today">
<h1 class="city" id="city"></h1>
<p class="updated" id="updated"></p>
<div class="big-icon" id="icon"></div>
<div class="big-temp" id="temp"></div>
<div class="summary" id="summary"></div>
<div class="stats">
<div>Feels like <strong id="feels"></strong></div>
<div>Humidity <strong id="humidity"></strong></div>
<div>Wind <strong id="wind"></strong></div>
</div>
</section>

<section class="forecast" id="forecast">
<h2>Next 5 days</h2>
<div id="forecast-list"></div>
</section>
</main>

<script>
// ----- Get elements -----
const searchForm = document.getElementById('search-form');
const cityInput = document.getElementById('city-input');
const searchBtn = document.getElementById('search-btn');
const messageBox = document.getElementById('message');
const todayBox = document.getElementById('today');
const forecastBox = document.getElementById('forecast');
const forecastList = document.getElementById('forecast-list');

// ----- Open-Meteo weather codes -> text and emoji -----
const CODES = {
0: ['Clear sky', '☀️'], 1: ['Mainly clear', '🌤'], 2: ['Partly cloudy', '⛅'], 3: ['Overcast', '☁️'],
45: ['Fog', '🌫'], 48: ['Freezing fog', '🌫'],
51: ['Light drizzle', '🌦'], 53: ['Drizzle', '🌦'], 55: ['Heavy drizzle', '🌦'],
56: ['Freezing drizzle', '🌧'], 57: ['Freezing drizzle', '🌧'],
61: ['Light rain', '🌧'], 63: ['Rain', '🌧'], 65: ['Heavy rain', '🌧'],
66: ['Freezing rain', '🌧'], 67: ['Freezing rain', '🌧'],
71: ['Light snow', '🌨'], 73: ['Snow', '❄️'], 75: ['Heavy snow', '❄️'], 77: ['Snow grains', '❄️'],
80: ['Rain showers', '🌦'], 81: ['Rain showers', '🌦'], 82: ['Violent showers', '⛈️'],
85: ['Snow showers', '🌨'], 86: ['Snow showers', '🌨'],
95: ['Thunderstorm', '⛈️'], 96: ['Thunderstorm with hail', '⛈️'], 99: ['Thunderstorm with hail', '⛈️']
};

function weatherInfo(code) {
return CODES[code] || ['Unknown', '❔'];
}

// ----- Small helpers -----
function showMessage(text, isError) {
messageBox.textContent = text;
messageBox.classList.toggle('error', Boolean(isError));
}

function makeElement(tag, className, text) {
const node = document.createElement(tag);
if (className) node.className = className;
if (text !== undefined) node.textContent = text;
return node;
}

// ----- Step 1: city name -> latitude and longitude (Geocoding API) -----
async function findCity(city) {
const url = 'https://geocoding-api.open-meteo.com/v1/search?name=' +
encodeURIComponent(city) + '&count=1&language=en&format=json';
const response = await fetch(url);
if (!response.ok) throw new Error('Could not search for that city.');
const data = await response.json();
if (!data.results || data.results.length === 0) {
throw new Error('City not found. Please check the spelling.');
}
return data.results[0];
}

// ----- Step 2: latitude and longitude -> weather (Forecast API) -----
async function fetchWeather(lat, lon) {
const url = 'https://api.open-meteo.com/v1/forecast' +
'?latitude=' + lat + '&longitude=' + lon +
'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m' +
'&daily=weather_code,temperature_2m_max,temperature_2m_min' +
'&timezone=auto&forecast_days=5';
const response = await fetch(url);
if (!response.ok) throw new Error('Could not load the weather data.');
return response.json();
}

// ----- Show data on the page (DOM updates) -----
function showToday(place, data) {
const now = data.current;
const info = weatherInfo(now.weather_code);
const fullName = [place.name, place.admin1, place.country].filter(Boolean).join(', ');

document.getElementById('city').textContent = fullName;
document.getElementById('updated').textContent = 'Updated ' + now.time.replace('T', ' ');
document.getElementById('icon').textContent = info[1];
document.getElementById('temp').textContent = Math.round(now.temperature_2m) + '°C';
document.getElementById('summary').textContent = info[0];
document.getElementById('feels').textContent = Math.round(now.apparent_temperature) + '°C';
document.getElementById('humidity').textContent = now.relative_humidity_2m + '%';
document.getElementById('wind').textContent = Math.round(now.wind_speed_10m) + ' km/h';
todayBox.classList.add('show');
}

function showForecast(data) {
const daily = data.daily;
forecastList.innerHTML = '';

daily.time.forEach(function (dateText, i) {
const info = weatherInfo(daily.weather_code[i]);
const date = new Date(dateText + 'T00:00:00');

const row = makeElement('div', 'day-row');
row.appendChild(makeElement('span', 'day',
date.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric' })));
row.appendChild(makeElement('span', 'emoji', info[1]));
row.appendChild(makeElement('span', 'desc', info[0]));
row.appendChild(makeElement('span', 'low', Math.round(daily.temperature_2m_min[i]) + '°'));
row.appendChild(makeElement('span', 'high', Math.round(daily.temperature_2m_max[i]) + '°'));
forecastList.appendChild(row);
});

forecastBox.classList.add('show');
}

// ----- Handle the search -----
searchForm.addEventListener('submit', async function (event) {
event.preventDefault();
const city = cityInput.value.trim();

if (city === '') {
showMessage('Please enter a city name.', true);
return;
}

showMessage('Loading weather for ' + city + '...', false);
searchBtn.disabled = true;

try {
const place = await findCity(city);
const data = await fetchWeather(place.latitude, place.longitude);
showToday(place, data);
showForecast(data);
showMessage('', false);
} catch (error) {
todayBox.classList.remove('show');
forecastBox.classList.remove('show');
// A TypeError means the network request itself failed
const text = error instanceof TypeError
? 'Network error. Check your internet connection and try again.'
: error.message;
showMessage(text, true);
} finally {
searchBtn.disabled = false;
}
});
</script>
</body>
</html>
